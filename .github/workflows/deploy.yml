name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm install -g html-minifier-terser
          npm install -g cssnano-cli
          npm install -g terser
          
      - name: Optimize HTML
        run: |
          html-minifier-terser --input-dir . --output-dir ./dist --file-ext html \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            --collapse-whitespace
            
      - name: Optimize CSS
        run: |
          mkdir -p dist
          cssnano styles.css dist/styles.css
          
      - name: Optimize JavaScript
        run: |
          mkdir -p dist
          terser script.js -o dist/script.js --compress --mangle
          terser sw.js -o dist/sw.js --compress --mangle
          
      - name: Copy other files
        run: |
          cp -r logos dist/ 2>/dev/null || :
          cp -r awards dist/ 2>/dev/null || :
          cp manifest.json dist/ 2>/dev/null || :
          cp robots.txt dist/ 2>/dev/null || :
          cp sitemap.xml dist/ 2>/dev/null || :
          cp 404.html dist/ 2>/dev/null || :
          cp profile.jpg dist/ 2>/dev/null || :
          cp *.pdf dist/ 2>/dev/null || :
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 